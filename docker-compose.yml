services:
  db:
    image: postgres:latest
    container_name: airy-postgres-db
    environment:
      POSTGRES_DB: airy_db
      POSTGRES_USER: airy_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    restart: always

  # Control-panel API (ASP.NET on the Evil SDK). Reachable internally only, through
  # Caddy (/api/* on airy.thatevilguy.com). Airy's database with its own role
  # airybotcode_app and the users database with evil_users_airy, both from
  # AiryBotCode-data (600). Deploy: ./scripts/airy-deploy.sh prod (this service only).
  api:
    build:
      context: .
      dockerfile: Api.dockerfile
      additional_contexts:
        evil-feed: /mnt/hdd/projects/evil-sdk-data/feed
      args:
        COMMIT: ${AIRY_COMMIT:-}
    depends_on:
      - db
    restart: always
    env_file:
      - /mnt/hdd/projects/AiryBotCode-data/airy-db.env
      - /mnt/hdd/projects/AiryBotCode-data/evil-users.env
    environment:
      - PublicUrl=https://airy.thatevilguy.com/api
      - Discord__SignIn=false
      - Proxies__ClientHeader=CF-Connecting-IP
      - Proxies__Addresses__0=${AIRY_CADDY_ADDRESS_0:-}
      - Proxies__Addresses__1=${AIRY_CADDY_ADDRESS_1:-}
      - Telemetry__Endpoint=http://host.docker.internal:4318
      - Telemetry__Protocol=http/protobuf
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./AiryBotCode.Api/appsettings.json:/app/appsettings.json:ro
    networks:
      - default
      - hive

  # Reverse proxy behind Tailscale: password gate, serves the SPA + /api over
  # plain HTTP on 127.0.0.1:8088. Tailscale Serve/Funnel terminates TLS and
  # proxies to this port.
  caddy:
    build:
      context: .
      dockerfile: Caddy.dockerfile
    depends_on:
      - api
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Default network (api/db) + the Hive's network so spine/spine-ui resolve.
    networks:
      - default
      - hive

  # airybot:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     args:
  #       PROJECT_PATH: "Bots/AiryBotCode.AiryBot/AiryBotCode.AiryBot.csproj"
  #       DLL_NAME: "AiryBotCode.AiryBot.dll"
  #   depends_on:
  #     - db
  #   restart: always
  #   volumes:
  #     - ./Bots/AiryBotCode.AiryBot/appsettings.json:/app/appsettings.json
  airydevbot:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        evil-feed: /mnt/hdd/projects/evil-sdk-data/feed
      args:
        PROJECT_PATH: "Bots/AiryBotCode.AiryDevBot/AiryBotCode.AiryDevBot.csproj"
        DLL_NAME: "AiryBotCode.AiryDevBot.dll"
        SLN_PATH: "AiryBotCode.sln"
    depends_on:
      - db
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Reach Postgres by its compose service name; overrides Database:Host in the
    # mounted appsettings.json (which is "localhost" for host runs).
    environment:
      - Database__Host=db
      - Telemetry__Endpoint=http://host.docker.internal:4318
      - Telemetry__Protocol=http/protobuf
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=prod
    volumes:
      - ./Bots/AiryBotCode.AiryDevBot/appsettings.json:/app/appsettings.json
    # Default network (db) + the Hive's network so the bot can subscribe to the
    # Wraith tools WS for outbound agent effects (say / ask_user → Hive:EffectsWsUrl).
    networks:
      - default
      - hive
